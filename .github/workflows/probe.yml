# TEMPORARY probe - prove the inbox workflow fires on an issue.
name: Probe inbox forwarder

on:
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Open a probe issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: node probe-issue.mjs
